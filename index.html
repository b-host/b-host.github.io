<script>
function mostrarQR(dado, tipo = "none") {
    const modal = document.getElementById("qrModal");
    const qrContainer = document.getElementById("qrcode");

    modal.style.display = "block";

    let payload = "";

    switch (tipo) {
        case "btc":
            payload = "bitcoin:" + dado;
            break;

        case "lightning":
            payload = "lightning:" + dado;
            break;

        case "liquid":
            payload = "bitcoin:" + dado + "?asset=6f0279e9ed52...";
            break;

        default:
            payload = dado;
    }

    // limpa conteúdo anterior
    qrContainer.innerHTML = "";

    // ===== QR CODE =====
    const qrDiv = document.createElement("div");
    qrContainer.appendChild(qrDiv);

    new QRCode(qrDiv, {
        text: payload,
        width: 250,
        height: 250
    });

    // ===== WRAPPER (Bootstrap) =====
    const wrapper = document.createElement("div");
    wrapper.className = "mt-3";

    // ===== INPUT =====
    const input = document.createElement("input");
    input.type = "text";
    input.value = dado; // mostra apenas o dado
    input.readOnly = true;
    input.className = "form-control text-center";
    input.onclick = () => input.select();

    // ===== BOTÃO PADRÃO LINKS =====
    const botao = document.createElement("a");
    botao.href = "#";
    botao.className = "links hover d-flex align-items-center justify-content-center gap-2";
    botao.style.marginTop = "10px";

    botao.innerHTML = `
        <i class="fas fa-copy links-in"></i>
        <b>Copiar</b>
    `;

    botao.onclick = function (e) {
        e.preventDefault();
        copiarTexto(dado);
    };

    // adiciona elementos
    wrapper.appendChild(input);
    wrapper.appendChild(botao);
    qrContainer.appendChild(wrapper);
}

// ===== FUNÇÃO DE CÓPIA =====
function copiarTexto(texto) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(texto)
            .then(() => console.log("Copiado"))
            .catch(err => console.error(err));
    } else {
        const textarea = document.createElement("textarea");
        textarea.value = texto;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
    }
}

// ===== FECHAR MODAL =====
function fecharQR() {
    document.getElementById("qrModal").style.display = "none";
}
</script>
